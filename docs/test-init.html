<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<pre id="log">Loading...</pre>
<script type="module">
const log = s => { document.getElementById('log').textContent += '\n' + s; };
try {
  const kaspa = await import('https://esm.sh/@onekeyfe/kaspa-wasm@1.0.2?bundle');
  await kaspa.default();
  log('SDK ready');
  const arr = new Uint8Array(32); crypto.getRandomValues(arr);
  const hex = Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
  const pk = new kaspa.PrivateKey(hex);
  // Try pk.toAddress
  try { log('pk.toAddress("mainnet"): ' + pk.toAddress('mainnet').toString()); } catch(e) { log('toAddress mainnet err: ' + e.message); }
  try { log('pk.toAddress(0): ' + pk.toAddress(0).toString()); } catch(e) { log('toAddress 0 err: ' + e.message); }
  // Try Keypair.toAddress
  try {
    const kp = pk.toKeypair('mainnet');
    log('kp: ' + typeof kp);
    log('kp.toString(): ' + kp.toString());
    try { log('kp.toAddress(): ' + kp.toAddress().toString()); } catch(e) { log('kp.toAddress err: ' + e.message); }
  } catch(e) { log('toKeypair err: ' + e.message); }
  // Try pk.toKeypair
  try {
    const kp2 = pk.toKeypair(0);
    log('kp2: ' + typeof kp2 + ' ' + kp2.toString());
  } catch(e) { log('toKeypair 0 err: ' + e.message); }
} catch(e) { log('Error: ' + e.message); }
</script>
</body></html>
