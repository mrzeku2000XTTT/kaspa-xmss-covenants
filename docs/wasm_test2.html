<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kaspa WASM Test 2</title></head><<body>
<h1>Kaspa WASM SDK Browser Test v2</h1>
<pre id="log"></pre>
<script type="module">
const log = document.getElementById('log');
function out(msg) { log.textContent += msg + '\n'; }

out('1. Importing @onekeyfe/kaspa-wasm...');
const kaspa = await import('https://esm.sh/@onekeyfe/kaspa-wasm@1.0.2');
out('✅ Imported. Has initSync: ' + (typeof kaspa.initSync === 'function'));
out('Has createTransactions: ' + (typeof kaspa.createTransactions === 'function'));
out('Has createInputSignature: ' + (typeof kaspa.createInputSignature === 'function'));
out('Has PrivateKey: ' + (typeof kaspa.PrivateKey === 'function'));
out('Has RpcClient: ' + (typeof kaspa.RpcClient === 'function'));

out('\n2. Fetching raw WASM binary from unpkg...');
try {
  const wasmRes = await fetch('https://unpkg.com/@onekeyfe/kaspa-wasm@1.0.2/kaspa_bg.wasm.bin');
  out('Fetch status: ' + wasmRes.status + ' ' + wasmRes.statusText);
  const wasmBytes = await wasmRes.arrayBuffer();
  out('WASM size: ' + wasmBytes.byteLength + ' bytes');

  out('\n3. Creating WebAssembly.Module...');
  const wasmModule = new WebAssembly.Module(wasmBytes);
  out('✅ Module created: ' + wasmModule.constructor.name);

  out('\n4. Calling initSync...');
  kaspa.initSync({ module: wasmModule });
  out('✅ initSync succeeded!');

  out('\n5. Testing createAddress...');
  const pk = new kaspa.PrivateKey();
  const addr = kaspa.createAddress(pk, 'mainnet');
  out('✅ Address: ' + addr.toString());

  out('\n6. Testing createTransactions...');
  // Test with a dummy address
  out('Private key: ' + pk.toString());
  const pubKey = kaspa.schnorr.getPublicKey(pk);
  out('Pubkey hex: ' + Array.from(pubKey).map(b=>b.toString(16).padStart(2,'0')).join(''));

} catch(e) {
  out('❌ Error: ' + e.message);
  out(e.stack || '');
}
</script>
</body></html>
