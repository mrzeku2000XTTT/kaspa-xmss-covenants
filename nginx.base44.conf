server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/javascript js mjs;
    }

    # No-cache for HTML/JS/CSS/JSON
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # WASM caching
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vercel rewrite: /cook-api/:path* -> https://dev-api-kcc20.kaspa.com/:path*
    location /cook-api/ {
        proxy_pass https://dev-api-kcc20.kaspa.com/;
        proxy_set_header Host dev-api-kcc20.kaspa.com;
        proxy_set_header Accept application/json;
        proxy_ssl_server_name on;
    }

    # Vercel rewrite: /vprog-tt/:path* -> https://vprogs-tt.izio.fr/:path*
    location /vprog-tt/ {
        proxy_pass https://vprogs-tt.izio.fr/;
        proxy_set_header Host vprogs-tt.izio.fr;
        proxy_set_header Access-Control-Allow-Origin "*";
        proxy_set_header Cross-Origin-Resource-Policy "cross-origin";
        proxy_ssl_server_name on;
    }

    # Serverless function proxy: /api/cook/* -> https://dev-api-kcc20.kaspa.com/*
    location /api/cook/ {
        proxy_pass https://dev-api-kcc20.kaspa.com/;
        proxy_set_header Host dev-api-kcc20.kaspa.com;
        proxy_set_header Accept application/json;
        proxy_ssl_server_name on;
    }

    # Serverless function proxy: /api/ksocial -> https://mainnet.kaspatalk.net
    location /api/ksocial {
        proxy_pass https://mainnet.kaspatalk.net;
        proxy_set_header Host mainnet.kaspatalk.net;
        proxy_ssl_server_name on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
