<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<pre id="log" style="color:#0f0;background:#000;font-size:12px;white-space:pre-wrap;">Starting...</pre>
<script>
const log = s => { document.getElementById('log').textContent += '\n' + s; };
window.onerror = (msg, src, line, col, err) => { log('WINDOW ERROR: ' + msg + ' at ' + line + ':' + col + '\n' + (err && err.stack)); };

async function main() {
  try {
    log('Reading localStorage...');
    const wallets = JSON.parse(localStorage.getItem('scorpion_wallets') || '[]');
    log('wallets count: ' + wallets.length);
    const idx = parseInt(localStorage.getItem('scorpion_active_wallet') || '0');
    log('active idx: ' + idx);
    const wallet = wallets[idx];
    log('active wallet address: ' + (wallet ? wallet.address : 'NONE'));

    log('Fetching UTXOs...');
    const API_BASE = 'https://api.kaspa.org';
    const res = await fetch(`${API_BASE}/addresses/${wallet.address}/utxos`);
    log('fetch status: ' + res.status);
    const utxos = await res.json();
    log('utxos: ' + JSON.stringify(utxos).slice(0, 300));
    log('DONE - no errors');
  } catch(e) {
    log('CAUGHT ERROR: ' + e.message + '\n' + e.stack);
  }
}
main();
</script>
</body></html>
