<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kaspa WASM Test 4</title></head><body>
<h1>Kaspa WASM SDK Browser Test v4</h1>
<pre id="log"></pre>
<script type="module">
const log = document.getElementById('log');
function out(msg) { log.textContent += msg + '\n'; }

try {
  out('1. Importing SDK...');
  const kaspa = await import('https://esm.sh/@onekeyfe/kaspa-wasm@1.0.2');
  out('✅ Imported');

  out('\n2. Fetching WASM binary...');
  const wasmRes = await fetch('https://unpkg.com/@onekeyfe/kaspa-wasm@1.0.2/kaspa_bg.wasm.bin');
  const wasmBytes = await wasmRes.arrayBuffer();
  out('✅ Size: ' + wasmBytes.byteLength + ' bytes');

  out('\n3. Trying async WebAssembly.instantiate...');
  // Try getting the import object from the module
  // The esm.sh module has the kaspa_bg.wasm.mjs which should have the imports
  // Let's try initSync in a setTimeout to allow the UI to update
  out('Calling initSync in 100ms...');
  setTimeout(async () => {
    try {
      const wasmModule = await WebAssembly.compile(wasmBytes);
      out('✅ Module compiled');
      
      // Try initSync - it might take time
      out('Calling initSync...');
      const result = kaspa.initSync({ module: wasmModule });
      out('✅ initSync returned: ' + result);
      
      out('\n5. Testing createAddress...');
      const pk = new kaspa.PrivateKey();
      const addr = kaspa.createAddress(pk, 'mainnet');
      out('✅ Address: ' + addr.toString());
      
      out('\n6. Testing createTransactions...');
      const entries = [{
        address: addr.toString(),
        outpoint: { transactionId: 'a'.repeat(64), index: 0 },
        amount: BigInt(100000000),
        scriptPublicKey: { version: 0, script: '2088' + 'a'.repeat(60) + 'ac' },
        blockDaaScore: BigInt(1000),
        isCoinbase: false,
      }];
      const txResult = await kaspa.createTransactions({
        entries,
        outputs: [{ address: addr.toString(), amount: BigInt(50000000) }],
        changeAddress: addr.toString(),
        priorityFee: BigInt(5000),
        networkId: 'mainnet',
      });
      out('✅ createTransactions: ' + txResult.transactions.length + ' tx(s)');
      
      out('\n7. Testing createInputSignature...');
      const tx = txResult.transactions[0].transaction;
      for (let i = 0; i < tx.inputs.length; i++) {
        const sig = kaspa.createInputSignature(tx, i, pk, 1);
        tx.inputs[i].signatureScript = sig;
        out('✅ Input ' + i + ' signed');
      }
      
      out('\n🎉 ALL TESTS PASSED!');
    } catch(e) {
      out('❌ Error: ' + e.message);
      out(e.stack || '');
    }
  }, 100);
  
  out('Waiting for initSync...');
} catch(e) {
  out('❌ Fatal: ' + e.message);
  out(e.stack || '');
}
</script>
</body></html>
