<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<pre id="log">Loading...</pre>
<script type="module">
const log = s => { document.getElementById('log').textContent += '\n' + s; console.log(s); };
try {
  log('Importing kaspa?bundle...');
  const kaspa = await import('https://esm.sh/@onekeyfe/kaspa-wasm@1.0.2?bundle');
  log('Imported. typeof default: ' + typeof kaspa.default);
  log('Calling kaspa.default()...');
  await kaspa.default();
  log('SUCCESS! SDK initialized.');
  log('PrivateKey: ' + typeof kaspa.PrivateKey);
  log('createAddress: ' + typeof kaspa.createAddress);
  // Test key generation
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  const hex = Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
  const pk = new kaspa.PrivateKey(hex);
  const addr = kaspa.createAddress(pk, 'mainnet');
  log('Test address: ' + addr.toString());
  log('ALL GOOD - SDK works on main thread!');
} catch(e) {
  log('FAILED: ' + e.message);
  log(e.stack);
}
</script>
</body></html>
